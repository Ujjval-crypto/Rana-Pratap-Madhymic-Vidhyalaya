```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome | My Website</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .container {
            max-width: 650px;
            padding: 50px 35px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 2.8rem;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: #d0d8e5;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 14px 35px;
            background: #ffffff;
            color: #243b55;
            text-decoration: none;
            font-weight: bold;
            border-radius: 30px;
            transition: 0.3s ease;
        }

        .btn:hover {
            transform: translateY(-4px);
            background: #dce8ff;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }

        .footer {
            margin-top: 35px;
            font-size: 0.85rem;
            color: #aab7c9;
        }

        @media (max-width: 500px) {
            h1 {
                font-size: 2rem;
            }

            .container {
                padding: 35px 22px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Welcome! 👋</h1>

        <p>
            We're glad you're here.
            Explore our website, discover its features
            and enjoy your experience.
        </p>

        <a href="./Html/index.html" class="btn">
            Enter Website →
        </a>

        <div class="footer">
            © 2026 My Website. All rights reserved.
        </div>

    </div>

</body>
</html>
